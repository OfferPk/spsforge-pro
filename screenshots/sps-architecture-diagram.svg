<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="100%" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131e34"/>
      <stop offset="100%" stop-color="#1a2a46"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bgGrad)" />

  <!-- Header -->
  <text x="40" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700" fill="#ffffff">SPSForge Pro — System Architecture</text>
  <text x="40" y="70" font-family="JetBrains Mono, monospace" font-size="12" fill="#00e5ff">CCSDS 851.0-M-1 SOIS SUBNETWORK PACKET SERVICE (SPS) ARCHITECTURE</text>

  <!-- Application Layer (Top) -->
  <rect x="40" y="100" width="920" height="90" rx="8" fill="url(#cardGrad)" stroke="#223454" stroke-width="1.5" />
  <rect x="40" y="100" width="920" height="30" rx="8" fill="#0e172a" />
  <text x="55" y="121" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1. Spacecraft Flight Software Application Entities (cFS Applications)</text>

  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="200" height="40" rx="4" fill="#090e18" stroke="#ff1744" />
    <text x="100" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Emergency FDIR (Prio 7)</text>

    <rect x="230" y="0" width="200" height="40" rx="4" fill="#090e18" stroke="#ffab00" />
    <text x="330" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">ADCS Guidance (Prio 5)</text>

    <rect x="460" y="0" width="200" height="40" rx="4" fill="#090e18" stroke="#2979ff" />
    <text x="560" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Health Telemetry (Prio 3)</text>

    <rect x="690" y="0" width="190" height="40" rx="4" fill="#090e18" stroke="#64748b" />
    <text x="785" y="24" font-family="JetBrains Mono, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Payload Dump (Prio 0)</text>
  </g>

  <!-- Service Primitives Callout (Arrows) -->
  <g transform="translate(450, 195)">
    <path d="M 0 0 L 0 25" stroke="#00e5ff" stroke-width="2" />
    <polygon points="-4,25 0,33 4,25" fill="#00e5ff" />
    <text x="15" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e5ff">PACKET_SEND / PACKET_RECEIVE (§3.2)</text>
  </g>

  <!-- SPS Service Layer (Middle) -->
  <rect x="40" y="235" width="920" height="150" rx="8" fill="url(#cardGrad)" stroke="#00e5ff" stroke-width="1.5" />
  <rect x="40" y="235" width="920" height="30" rx="8" fill="#0e172a" />
  <text x="55" y="256" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#00e5ff">2. SOIS Subnetwork Packet Service (SPS) Engine</text>

  <g transform="translate(60, 275)">
    <rect x="0" y="0" width="270" height="95" rx="6" fill="#090e18" stroke="#223454" />
    <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#00e5ff">Address & Channel Router (§3.1)</text>
    <text x="15" y="45" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Destination Subnetwork Addr</text>
    <text x="15" y="63" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Point-to-Point & Broadcast (0xFF)</text>
    <text x="15" y="81" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e676">• Logical Channel Segregation (0..15)</text>

    <rect x="305" y="0" width="270" height="95" rx="6" fill="#090e18" stroke="#223454" />
    <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#ffab00">Priority Queue Scheduler (§3.1.4)</text>
    <text x="15" y="45" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• 8 Priority Levels (0 to 7)</text>
    <text x="15" y="63" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Strict Preemption (7 over 0)</text>
    <text x="15" y="81" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e676">• In-Order Channel Delivery</text>

    <rect x="610" y="0" width="270" height="95" rx="6" fill="#090e18" stroke="#223454" />
    <text x="15" y="25" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#00e676">Quality of Service Engine (§2.4)</text>
    <text x="15" y="45" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Best Effort (Unacknowledged)</text>
    <text x="15" y="63" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8">• Assured (Guaranteed Delivery)</text>
    <text x="15" y="81" font-family="JetBrains Mono, monospace" font-size="10" fill="#ff1744">• PACKET_FAILURE Fault Delivery</text>
  </g>

  <!-- Subnetwork Downlink Arrow -->
  <g transform="translate(450, 390)">
    <path d="M 0 0 L 0 25" stroke="#00e676" stroke-width="2" />
    <polygon points="-4,25 0,33 4,25" fill="#00e676" />
    <text x="15" y="20" font-family="JetBrains Mono, monospace" font-size="10" fill="#00e676">Subnetwork Protocol Wireframes (§2.3)</text>
  </g>

  <!-- Physical Subnetwork & Hardware Layer (Bottom) -->
  <rect x="40" y="430" width="920" height="135" rx="8" fill="url(#cardGrad)" stroke="#223454" stroke-width="1.5" />
  <rect x="40" y="430" width="920" height="30" rx="8" fill="#0e172a" />
  <text x="55" y="451" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3. Spacecraft Physical Onboard Subnetworks</text>

  <g transform="translate(60, 470)">
    <rect x="0" y="0" width="270" height="80" rx="6" fill="#090e18" stroke="#00e5ff" />
    <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e5ff">SpaceWire (ECSS-E-ST-50-12C)</text>
    <text x="15" y="42" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">• Logical Address + Protocol ID 0x02</text>
    <text x="15" y="58" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1">• Channel Byte + Packet Payload</text>
    <text x="15" y="74" font-family="JetBrains Mono, monospace" font-size="9" fill="#00e676">• End of Packet (EOP) Marker</text>

    <rect x="305" y="0" width="270" height="80" rx="6" fill="#090e18" stroke="#ffab00" />
    <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffab00">MIL-STD-1553B Dual Redundant Bus</text>
    <text x="15" y="42" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">• Subaddress Block Segmentation</text>
    <text x="15" y="58" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1">• 32-Word Frame Boundary Alignment</text>
    <text x="15" y="74" font-family="JetBrains Mono, monospace" font-size="9" fill="#00e676">• Command / Status Word Handshake</text>

    <rect x="610" y="0" width="270" height="80" rx="6" fill="#090e18" stroke="#00e676" />
    <text x="15" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#00e676">CANopen / CAN 2.0B Bus</text>
    <text x="15" y="42" font-family="JetBrains Mono, monospace" font-size="9" fill="#94a3b8">• 29-bit CAN ID Message Groups</text>
    <text x="15" y="58" font-family="JetBrains Mono, monospace" font-size="9" fill="#cbd5e1">• 8-Byte Frame Multi-PDU Transport</text>
    <text x="15" y="74" font-family="JetBrains Mono, monospace" font-size="9" fill="#00e676">• Arbitration Loss Resilience</text>
  </g>
</svg>
